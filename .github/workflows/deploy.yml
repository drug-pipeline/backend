name: Deploy Backend to GCE

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  PROJECT_ID: nimble-poet-474703-f7
  REGION: asia-northeast3
  REPO_NAME: backend
  IMAGE_NAME: backend
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev -q

      - name: Compose IMAGE_URI
        run: echo "IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Build & Push image
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          echo "Building $IMAGE_URI (latest, $SHA_TAG)"
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:$SHA_TAG" .
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:$SHA_TAG"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy on VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          REPO_NAME: ${{ env.REPO_NAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${SSH_USER:-ubuntu}@${SSH_HOST} \
            "PROJECT_ID=$PROJECT_ID REGION=$REGION REPO_NAME=$REPO_NAME IMAGE_NAME=$IMAGE_NAME bash -se" <<'EOSH'
            set -euo pipefail

            IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:latest"

            mkdir -p ~/apps/backend
            cd ~/apps/backend

            cat > docker-compose.yml <<EOF
            services:
              backend:
                image: ${IMAGE_URI}
                restart: unless-stopped
                ports:
                  - "8080:8080"
                environment:
                  - PORT=8080
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f || true

            echo "--- ps ---"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"
            echo "--- curl ---"
            (curl -sSI http://127.0.0.1 || true) | sed -n '1,20p'
          EOSH
      
